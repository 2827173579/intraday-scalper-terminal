[project]
name = "intraday-scalper"
version = "0.1.0"
description = "SOXL / SOXS minute-level intraday signal system: websocket-first Finnhub data, deterministic strategies, manual-trade journal, event-driven backtest. Never places orders."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "us-market-radar" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "duckdb>=1.0",
  "pyarrow>=15.0",
  "websocket-client>=1.8",
  "websockets>=12.0",
  "alpaca-py>=0.45",
  "rich>=13.0",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-ra"
filterwarnings = ["error::FutureWarning"]
